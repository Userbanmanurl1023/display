name: Sign APK

on:
  push:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Align and sign (uses preinstalled SDK)
        run: |
          set -x
          pwd
          ls -la
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            for d in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/sdk"; do
              [ -d "$d/build-tools" ] && SDK="$d" && break
            done
          fi
          echo "SDK=$SDK"
          ls "$SDK/build-tools"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT"
          "$BT/zipalign" -p 4 app-unsigned.apk app-aligned.apk
          keytool -genkeypair -keystore debug.jks -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Unknown, C=US"
          "$BT/apksigner" sign --ks debug.jks --ks-pass:pass:android --v1-signing-enabled true --v2-signing-enabled true --out app-signed.apk app-aligned.apk
          "$BT/apksigner" verify --print-certs app-signed.apk
          ls -la app-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: app-signed.apk
